components:
  schemas:
    Crew:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
      required:
      - first_name
      - id
      - last_name
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Journey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        route:
          type: integer
        route_name:
          type: string
          readOnly: true
        train:
          type: integer
        train_name:
          type: string
          readOnly: true
        crew:
          type: array
          items:
            type: integer
        departure_time:
          type: string
          format: date-time
        arrival_time:
          type: string
          format: date-time
        available_seats:
          type: integer
          readOnly: true
      required:
      - arrival_time
      - available_seats
      - departure_time
      - id
      - route
      - route_name
      - train
      - train_name
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
      required:
      - created_at
      - id
      - tickets
